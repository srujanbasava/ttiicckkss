<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 400px;
        }

        h2 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 15px;
            margin: 20px 0;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        button {
            padding: 15px 30px;
            background: #ff4081;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #e91e63;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Enter Your Email ID</h2>
        <input type="email" placeholder="Enter your email" required>
        <br>
        <button onclick="showMessage()">Submit</button>
    </div>

    <script>
        function showMessage() {
            alert("We will send the ticket to your mail within 10 minutes.");
        }
    </script>

</body>
</html>
