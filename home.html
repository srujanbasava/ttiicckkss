<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Here Button</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }

        .click-btn {
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #007bff, #00c6ff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
            text-decoration: none;
        }

        .click-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <a href="ss.html" class="click-btn">Click Here</a>

</body>
</html>
